name: Thesis CI

on:
  push:
    branches: [main]
    paths:
      - "thesis/**"
      - "paper/**"
      - "pages/**"
      - ".github/workflows/thesis.yml"
  pull_request:
    branches: [main]
    paths:
      - "thesis/**"
      - "paper/**"
      - "pages/**"
      - ".github/workflows/thesis.yml"
  workflow_dispatch:

jobs:
  discover:
    name: Discover chapters
    runs-on: ubuntu-latest
    outputs:
      chapters: ${{ steps.set.outputs.chapters }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - id: set
        run: |
          chapters=$(ls thesis/chapters/*.tex | xargs -I{} basename {} .tex | jq -R . | jq -sc .)
          echo "chapters=$chapters" >> "$GITHUB_OUTPUT"

  build-thesis:
    name: Build thesis PDF
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: xu-cheng/latex-action@v3
        with:
          working_directory: thesis
          root_file: thesis.tex
          texlive_version: latest
          extra_system_packages: coreutils icu inkscape
      - uses: actions/upload-artifact@v4
        with:
          name: thesis-pdf
          path: thesis/thesis.pdf

  build-chapters:
    name: "Chapter: ${{ matrix.chapter }}"
    runs-on: ubuntu-latest
    needs: discover
    strategy:
      fail-fast: false
      matrix:
        chapter: ${{ fromJson(needs.discover.outputs.chapters) }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - run: sed -i "s/CHAPTER_PLACEHOLDER/${{ matrix.chapter }}/" thesis/chapter.tex
      - uses: xu-cheng/latex-action@v3
        with:
          working_directory: thesis
          root_file: chapter.tex
          texlive_version: latest
          extra_system_packages: coreutils icu inkscape
      - run: |
          mkdir -p out
          cp thesis/chapter.pdf "out/chapter-${{ matrix.chapter }}.pdf"
      - uses: actions/upload-artifact@v4
        with:
          name: chapter-${{ matrix.chapter }}
          path: out/chapter-${{ matrix.chapter }}.pdf

  build-papers:
    name: Build papers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: xu-cheng/latex-action@v3
        with:
          working_directory: paper/randmbc-note
          root_file: paper.tex
          texlive_version: latest
          extra_system_packages: coreutils icu inkscape
      - run: |
          mkdir -p out
          cp paper/randmbc-note/paper.pdf out/randmbc-note.pdf
      - uses: actions/upload-artifact@v4
        with:
          name: papers
          path: out/

  deploy:
    name: Deploy to gh-pages
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: [build-thesis, build-chapters, build-papers]
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: thesis-pdf
          path: deploy/thesis-pdf
      - uses: actions/download-artifact@v4
        with:
          pattern: chapter-*
          path: deploy/chapters
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: papers
          path: deploy/papers
      - uses: actions/checkout@v4
        with:
          path: repo
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages

      - name: Generate chapters index
        run: |
          repo/scripts/chapters-index.sh deploy/chapters > deploy/chapters.json

      - name: Update gh-pages branch
        run: |
          mkdir -p gh-pages/chapters gh-pages/papers
          cp deploy/thesis-pdf/thesis.pdf gh-pages/thesis.pdf
          cp deploy/chapters/*.pdf gh-pages/chapters/
          cp deploy/chapters.json gh-pages/chapters.json
          cp deploy/papers/*.pdf gh-pages/papers/
          cp repo/pages/index.html gh-pages/index.html
          cp repo/pages/.nojekyll gh-pages/.nojekyll
          cd gh-pages
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm -f index.md _config.yml || true
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to deploy"
          else
            git commit -m "deploy: update thesis, chapters, and papers"
            git push origin gh-pages
          fi
